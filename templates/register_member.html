<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Anggota Keluarga</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>➕ Tambah Anggota Keluarga</h1>
            <p>Daftarkan anggota keluarga untuk sistem pembayaran ini</p>
        </header>

        <form method="POST" class="form-container">
            <div class="form-group">
                <label for="name">Nama Lengkap:</label>
                <input type="text" id="name" name="name" required placeholder="Masukkan nama lengkap">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="contoh@email.com">
            </div>

            <div class="form-group">
                <label for="phone">No. Telepon (Opsional):</label>
                <input type="tel" id="phone" name="phone" placeholder="08xxxxxxxxxx">
            </div>

            <button type="submit" class="btn btn-primary btn-large">Simpan Anggota</button>
        </form>

        <a href="/" class="back-link">← Kembali ke beranda</a>
    </div>
</body>
</html>
